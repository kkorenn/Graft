plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }

base.archivesName = 'graft-26.3'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories { maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } } }

dependencies {
	minecraft "com.mojang:minecraft:26.3"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation project(':core')
	// Compat only; Sodium is not bundled. Jar from Modrinth (sodium-fabric 0.9.2+mc26.3).
	compileOnly "maven.modrinth:sodium:mc26.3-0.9.2-fabric"
}

jar { from(project(':core').sourceSets.main.output) }

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

// ./gradlew :mc26_3:runClient -Pquickplay=<world>  (straight into a singleplayer world)
tasks.named('runClient') {
	if (project.hasProperty('quickplay')) {
		args '--quickPlaySingleplayer', project.property('quickplay')
	}
}
